services:
  db:
    image: postgres:16-alpine
    container_name: lms_db
    restart: always
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lms_network

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    networks:
      - lms_network

  web:
    build: .
    container_name: lms_web
    restart: always
    ports:
      - "8001:8000"
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 lms_project.wsgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-mjs-ea-gj6im-95z-st-m-q-g-in-q8ke0w-jnj-teol-n-safe

      - ALLOWED_HOSTS=localhost,127.0.0.1,158.160.241.177,web,nginx
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password_123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - lms_network

  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # <-- УБЕДИСЬ, что файл лежит в папке deploy
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - lms_network

  celery:
    build: .
    container_name: lms_celery
    restart: always
    command: celery -A lms_project worker -l info
    environment:
      - DEBUG=0
      - SECRET_KEY=django-insecure-mjs-ea-gj6im-95z-st-m-q-g-in-q8ke0w-jnj-teol-n-safe
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password_123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - lms_network

  celery-beat:
    build: .
    container_name: lms_celery_beat
    restart: always
    command: celery -A lms_project beat -l info
    environment:
      - DEBUG=0
      - SECRET_KEY=django-insecure-mjs-ea-gj6im-95z-st-m-q-g-in-q8ke0w-jnj-teol-n-safe
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password_123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - lms_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  lms_network:
    driver: bridge